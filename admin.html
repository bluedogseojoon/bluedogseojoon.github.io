<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>블루독 예약 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  /* 예약 페이지(booking.html)와 같은 구글 Apps Script 주소 */
  const API_URL = "https://script.google.com/macros/s/AKfycbxIWzmjbp93xS70GeA61aKl0dnzLZuOQtQulwpN_lGy2-Fdp9bg-jHCTNR9Z97ARDaA9w/exec";
</script>
<style>
  :root {
    --navy: #0B2545; --navy-2: #13315C; --sea: #1B6CA8; --sky: #E8F1FA;
    --bg: #F6F9FC; --card: #FFFFFF; --text: #14213D; --muted: #5B6B82; --line: #DCE4EE;
    --ok: #1E8E5A; --ok-bg: #E7F6EE; --warn: #B4412F; --warn-bg: #FBECE8; --amber: #9A6700; --amber-bg: #FFF4D6;
    --btn: #0B2545; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1628; --card: #10213A; --text: #E8EEF6; --muted: #9BAAC0; --line: #22385A;
      --sky: #15304F; --sea: #5AA7E6; --ok: #5FD39B; --ok-bg: #123A2A; --warn: #F08B77; --warn-bg: #3D1F1A;
      --amber: #F2C45A; --amber-bg: #3A2E10; --btn: #1B6CA8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1628; --card: #10213A; --text: #E8EEF6; --muted: #9BAAC0; --line: #22385A;
    --sky: #15304F; --sea: #5AA7E6; --ok: #5FD39B; --ok-bg: #123A2A; --warn: #F08B77; --warn-bg: #3D1F1A;
    --amber: #F2C45A; --amber-bg: #3A2E10; --btn: #1B6CA8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif; line-height: 1.5; }
  header { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; padding: 20px 16px 30px; }
  .top { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header .brand { font-size: 12px; letter-spacing: .12em; opacity: .8; }
  header h1 { margin: 2px 0 0; font-size: 21px; }
  .hbtn { font: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3);
    border-radius: 10px; padding: 7px 12px; cursor: pointer; }
  main { max-width: 640px; margin: -16px auto 40px; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  input { width: 100%; font: inherit; font-size: 16px; padding: 12px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .primary { width: 100%; margin-top: 12px; padding: 14px; font: inherit; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--btn); border: 0; border-radius: 12px; cursor: pointer; }
  .primary:disabled { opacity: .5; }
  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 14px; background: var(--warn-bg); color: var(--warn); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--navy); color: #fff;
    padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }

  /* 요약 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }

  /* 달력 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head b { font-size: 16px; }
  .nav { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 18px; cursor: pointer; }
  .nav:disabled { opacity: .3; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .wd { font-size: 12px; color: var(--muted); padding: 4px 0; }
  .d { min-height: 54px; border: 1.5px solid transparent; border-radius: 10px; background: var(--bg); color: var(--text);
    font: inherit; font-size: 14px; cursor: pointer; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .d .cnt { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 999px; background: var(--sky); color: var(--sea); }
  .d .tag { font-size: 10px; color: var(--muted); }
  .d.off { background: var(--warn-bg); }
  .d.off .tag { color: var(--warn); }
  .d.sel { border-color: var(--sea); }
  .d.out { visibility: hidden; }
  .d:disabled { opacity: .35; cursor: default; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  /* 날짜 상세 */
  .dayhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .dayhead h2 { margin: 0; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .chip.open { background: var(--ok-bg); color: var(--ok); }
  .chip.closed { background: var(--warn-bg); color: var(--warn); }
  .chip.full { background: var(--amber-bg); color: var(--amber); }
  .act { font: inherit; font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); white-space: nowrap; }
  .act.danger { border-color: var(--warn); color: var(--warn); }
  .act.go { border-color: var(--ok); color: var(--ok); }
  .act:disabled { opacity: .45; cursor: not-allowed; }
  .cls { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .cls-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cls-top .t { font-weight: 700; font-size: 16px; }
  .cls-top .n { font-weight: 500; flex: 1; min-width: 90px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .people { list-style: none; margin: 10px 0 0; padding: 0; }
  .people li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; flex-wrap: wrap; }
  .people .who { flex: 1; min-width: 150px; }
  .people .who small { display: block; color: var(--muted); font-size: 12px; }
  .people a { color: var(--sea); text-decoration: none; }
  .rental { background: var(--sky); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-top: 4px; }
  .empty { color: var(--muted); font-size: 13px; }
  .loading { opacity: .55; pointer-events: none; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div><div class="brand">BLUE DOG FREEDIVING</div><h1>예약 관리</h1></div>
    <div id="hbtns" hidden>
      <button class="hbtn" id="refresh" type="button">새로고침</button>
      <button class="hbtn" id="logout" type="button">로그아웃</button>
    </div>
  </div>
</header>

<main>
  <!-- 로그인 -->
  <form class="card" id="login">
    <h2>관리자 로그인</h2>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="primary" id="loginBtn" type="submit">들어가기</button>
    <div class="msg" id="loginMsg" hidden></div>
  </form>

  <!-- 관리 화면 -->
  <div id="app" hidden>
    <section class="card">
      <div class="stats">
        <div class="stat"><b id="sToday">0</b><span>오늘 예약</span></div>
        <div class="stat"><b id="sWeek">0</b><span>7일 안 예약</span></div>
        <div class="stat"><b id="sAll">0</b><span>전체 예약</span></div>
      </div>
    </section>

    <section class="card">
      <div class="cal-head">
        <button class="nav" id="prev" type="button" aria-label="이전 달">‹</button>
        <b id="month"></b>
        <button class="nav" id="next" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i style="background:var(--sky)"></i>숫자 = 예약 인원</span>
        <span><i style="background:var(--warn-bg)"></i>휴무일</span>
      </div>
    </section>

    <section class="card" id="detail" hidden></section>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const WEEK = ['일','월','화','수','목','금','토'];
const ITEMS = ['슈트','핀','웨이트','스노클'];
const LOCKED_REASONS = ['월요일 휴무','공휴일 휴무','화요일 휴무','수요일 휴무','목요일 휴무','금요일 휴무','토요일 휴무','일요일 휴무'];

let pw = '';
let data = null, dayMap = {}, view = null, selDate = null;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }

async function call(action, extra) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, pw }, extra || {})) });
  return res.json();
}

/* ---------- 로그인 ---------- */
$('login').addEventListener('submit', async e => {
  e.preventDefault();
  pw = $('pw').value;
  $('loginBtn').disabled = true; $('loginBtn').textContent = '확인 중…';
  try {
    const r = await call('admin_list');
    if (!r.ok) { showLoginErr(r.message); pw = ''; return; }
    try { sessionStorage.setItem('bluedog-admin', pw); } catch (_) {}
    enter(r);
  } catch (err) { showLoginErr('연결에 실패했어요. 인터넷을 확인해 주세요.'); }
  finally { $('loginBtn').disabled = false; $('loginBtn').textContent = '들어가기'; }
});
function showLoginErr(t) { $('loginMsg').hidden = false; $('loginMsg').textContent = t; }

$('logout').onclick = () => {
  try { sessionStorage.removeItem('bluedog-admin'); } catch (_) {}
  pw = ''; data = null; selDate = null;
  $('app').hidden = true; $('hbtns').hidden = true; $('login').hidden = false; $('pw').value = '';
};
$('refresh').onclick = async () => { await reload(); toast('최신 내용으로 불러왔어요'); };

async function reload() {
  document.body.classList.add('loading');
  try { const r = await call('admin_list'); if (!r.ok) throw new Error(r.message); setData(r); }
  catch (e) { toast(e.message || '불러오지 못했어요'); }
  finally { document.body.classList.remove('loading'); }
}

function enter(r) {
  $('login').hidden = true; $('app').hidden = false; $('hbtns').hidden = false;
  setData(r);
}

function setData(r) {
  data = r;
  dayMap = {};
  data.days.forEach(d => { d.people = {}; dayMap[d.date] = d; });
  data.bookings.forEach(b => { const d = dayMap[b.date]; if (d) (d.people[b.cls] = d.people[b.cls] || []).push(b); });
  if (!view) { const [y, m] = data.days[0].date.split('-').map(Number); view = { y, m }; }
  if (!selDate || !dayMap[selDate]) selDate = data.days[0].date;
  renderStats(); renderCalendar(); renderDetail();
}

/* ---------- 요약 ---------- */
function renderStats() {
  const today = data.days[0].date;
  const week = data.days[Math.min(7, data.days.length - 1)].date;
  $('sToday').textContent = data.bookings.filter(b => b.date === today).length;
  $('sWeek').textContent = data.bookings.filter(b => b.date <= week).length;
  $('sAll').textContent = data.bookings.length;
}

/* ---------- 달력 ---------- */
function dayCount(d) { return Object.values(d.people).reduce((a, l) => a + l.length, 0); }
function isOffDay(d) {
  // 모든 수업이 휴무 성격으로 닫힌 날
  return Object.values(d.slots).every(s => s.closed && (s.reason === '휴무' || s.reason.endsWith('휴무')));
}

function renderCalendar() {
  const { y, m } = view;
  $('month').textContent = y + '년 ' + m + '월';
  const grid = $('grid'); grid.innerHTML = '';
  WEEK.forEach(w => { const el = document.createElement('div'); el.className = 'wd'; el.textContent = w; grid.appendChild(el); });
  const firstW = new Date(y, m - 1, 1).getDay();
  const last = new Date(y, m, 0).getDate();
  for (let i = 0; i < firstW; i++) { const e = document.createElement('div'); grid.appendChild(e); }
  for (let dd = 1; dd <= last; dd++) {
    const date = ymd(y, m, dd);
    const d = dayMap[date];
    const b = document.createElement('button');
    b.type = 'button';
    const num = document.createElement('span'); num.textContent = dd; b.appendChild(num);
    if (!d) { b.className = 'd'; b.disabled = true; grid.appendChild(b); continue; }
    const cnt = dayCount(d);
    const off = isOffDay(d);
    b.className = 'd' + (off ? ' off' : '') + (date === selDate ? ' sel' : '');
    if (cnt) { const c = document.createElement('span'); c.className = 'cnt'; c.textContent = cnt + '명'; b.appendChild(c); }
    const partly = d.weekday === '월' || Object.values(d.slots).some(s => s.notRunning && s.reason === '공휴일 휴무');
    if (d.holiday || d.offDay || off || partly) {
      const t = document.createElement('span'); t.className = 'tag';
      t.textContent = d.offDay || off ? '휴무' : d.holiday ? d.holiday.slice(0, 4) : '풀장';
      b.appendChild(t);
    }
    b.addEventListener('click', () => { selDate = date; renderCalendar(); renderDetail(); $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    grid.appendChild(b);
  }
  const first = data.days[0].date, lastD = data.days[data.days.length - 1].date;
  $('prev').disabled = ymd(y, m, 1) <= first;
  $('next').disabled = ymd(y, m, last) >= lastD;
}
$('prev').onclick = () => { view.m--; if (view.m < 1) { view.m = 12; view.y--; } renderCalendar(); };
$('next').onclick = () => { view.m++; if (view.m > 12) { view.m = 1; view.y++; } renderCalendar(); };

/* ---------- 날짜 상세 ---------- */
function niceDate(date) {
  const [, m, d] = date.split('-').map(Number);
  return m + '월 ' + d + '일 (' + dayMap[date].weekday + ')';
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderDetail() {
  const box = $('detail'); box.hidden = false; box.innerHTML = '';
  const d = dayMap[selDate];

  const head = el('div', 'dayhead');
  const h = el('h2', null, niceDate(selDate) + (d.holiday ? ' · ' + d.holiday : ''));
  head.appendChild(h);
  const dayBtn = el('button', 'act ' + (d.offDay ? 'go' : 'danger'), d.offDay ? '하루 휴무 해제' : '하루 전체 휴무');
  dayBtn.type = 'button';
  dayBtn.onclick = () => d.offDay ? act('admin_open', { date: selDate, cls: '' }, '하루 휴무를 해제했어요')
                                  : act('admin_close', { date: selDate, cls: '' }, '하루 전체를 휴무로 설정했어요');
  head.appendChild(dayBtn);
  box.appendChild(head);

  if (d.offDay) box.appendChild(el('p', 'note', '이 날은 관리자가 하루 휴무로 설정했어요. 수강생은 이 날짜를 선택할 수 없어요.'));

  const totals = {}, counted = {};   // 같은 사람이 하루 두 수업이면 장비는 한 번만 셈
  // 그날 운영하지 않는 수업은 숨겨요 (예약이 남아 있는 경우만 예외)
  data.classes.filter(c => !d.slots[c.name].notRunning || (d.people[c.name] || []).length).forEach(c => {
    const s = d.slots[c.name];
    const people = d.people[c.name] || [];
    const card = el('div', 'cls');
    const top = el('div', 'cls-top');
    top.appendChild(el('span', 't', c.start));
    top.appendChild(el('span', 'n', c.name));

    const adminClosed = d.offClasses.includes(c.name);
    let chip;
    if (!s.closed) chip = el('span', 'chip open', '예약 중 ' + s.booked + '/' + c.capacity);
    else if (s.reason === '정원 마감') chip = el('span', 'chip full', '정원 마감 ' + s.booked + '/' + c.capacity);
    else chip = el('span', 'chip closed', (adminClosed ? '관리자 마감' : s.reason) + (s.booked ? ' · ' + s.booked + '명' : ''));
    top.appendChild(chip);

    // 버튼: 관리자가 닫은 수업은 '열기', 열려 있으면 '마감'
    const btn = el('button', 'act');
    btn.type = 'button';
    const fixed = LOCKED_REASONS.includes(s.reason) || s.reason === '예약 마감' || d.offDay;
    if (adminClosed) {
      btn.textContent = '다시 열기'; btn.className = 'act go';
      btn.onclick = () => act('admin_open', { date: selDate, cls: c.name }, c.name + ' 예약을 다시 열었어요');
      btn.disabled = d.offDay;
    } else {
      btn.textContent = '예약 마감'; btn.className = 'act danger';
      btn.onclick = () => act('admin_close', { date: selDate, cls: c.name }, c.name + ' 예약을 마감했어요');
      btn.disabled = fixed;
    }
    top.appendChild(btn);
    card.appendChild(top);

    if (LOCKED_REASONS.includes(s.reason)) card.appendChild(el('div', 'note', '운영요일·공휴일 규칙으로 닫힌 수업이에요. 바꾸려면 시트의 수업종류 탭을 수정하세요.'));
    if (s.reason === '겹치는 수업 진행') card.appendChild(el('div', 'note', c.conflicts.join(', ') + ' 예약이 있어서 자동으로 닫혔어요.'));

    if (people.length) {
      const ul = el('ul', 'people');
      people.forEach(p => {
        if (!counted[p.phone]) {
          counted[p.phone] = true;
          ITEMS.forEach(i => { if (p.rental.includes(i)) totals[i] = (totals[i] || 0) + 1; });
        }
        const li = el('li');
        const who = el('div', 'who');
        who.appendChild(document.createTextNode(p.name + ' · '));
        const a = el('a', null, p.phone); a.href = 'tel:' + p.phone.replace(/\D/g, ''); who.appendChild(a);
        who.appendChild(el('small', null, '렌탈: ' + p.rental));
        li.appendChild(who);
        const cancel = el('button', 'act danger', '예약 취소'); cancel.type = 'button';
        cancel.onclick = () => {
          if (cancel.dataset.sure !== '1') {       // 실수 방지: 두 번 눌러야 취소
            cancel.dataset.sure = '1'; cancel.textContent = '한 번 더 누르면 취소';
            setTimeout(() => { cancel.dataset.sure = ''; cancel.textContent = '예약 취소'; }, 4000);
            return;
          }
          act('admin_cancel', { date: selDate, cls: c.name, row: p.row, phone: p.phone }, p.name + '님 예약을 취소했어요');
        };
        li.appendChild(cancel);
        ul.appendChild(li);
      });
      card.appendChild(ul);
    } else {
      card.appendChild(el('div', 'note', '예약자 없음'));
    }
    box.appendChild(card);
  });

  const line = ITEMS.filter(i => totals[i]).map(i => i + ' ' + totals[i]).join(' · ');
  box.appendChild(el('div', 'rental', '🎒 이 날 렌탈 준비: ' + (line || '없음')));
}

async function act(action, extra, doneMsg) {
  document.body.classList.add('loading');
  try {
    const r = await call(action, extra);
    if (!r.ok) { toast(r.message || '처리하지 못했어요'); if (r.code === 'bad_password') $('logout').click(); return; }
    setData(r); toast(doneMsg);
  } catch (e) { toast('연결에 실패했어요. 다시 시도해 주세요.'); }
  finally { document.body.classList.remove('loading'); }
}

/* 같은 탭에서 새로고침하면 다시 로그인하지 않아도 돼요 (탭을 닫으면 로그아웃) */
(async () => {
  let saved = '';
  try { saved = sessionStorage.getItem('bluedog-admin') || ''; } catch (_) {}
  if (!saved) return;
