<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>블루독 수업 예약</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  /* ============================================================
     ✏️ 여기만 바꾸면 돼요: 구글 Apps Script 배포 주소를 "" 안에 붙여넣기
     비워두면 '미리보기 모드'로 예시 시간표가 보여요.
     ============================================================ */
  const API_URL = "https://script.google.com/macros/s/AKfycbxIWzmjbp93xS70GeA61aKl0dnzLZuOQtQulwpN_lGy2-Fdp9bg-jHCTNR9Z97ARDaA9w/exec";
</script>
<style>
  :root {
    --navy: #0B2545; --navy-2: #13315C; --sea: #1B6CA8; --sky: #E8F1FA;
    --bg: #F6F9FC; --card: #FFFFFF; --text: #14213D; --muted: #5B6B82;
    --line: #DCE4EE; --ok: #1E8E5A; --ok-bg: #E7F6EE; --warn: #B4412F; --warn-bg: #FBECE8;
    --btn: #0B2545; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1628; --card: #10213A; --text: #E8EEF6; --muted: #9BAAC0; --line: #22385A;
      --sky: #15304F; --sea: #5AA7E6; --ok: #5FD39B; --ok-bg: #123A2A; --warn: #F08B77; --warn-bg: #3D1F1A;
      --btn: #1B6CA8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1628; --card: #10213A; --text: #E8EEF6; --muted: #9BAAC0; --line: #22385A;
    --sky: #15304F; --sea: #5AA7E6; --ok: #5FD39B; --ok-bg: #123A2A; --warn: #F08B77; --warn-bg: #3D1F1A;
    --btn: #1B6CA8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif; line-height: 1.5; }
  header { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff;
    padding: 28px 16px 36px; text-align: center; }
  header .brand { font-size: 13px; letter-spacing: .12em; opacity: .8; }
  header h1 { margin: 6px 0 4px; font-size: 24px; }
  header p { margin: 0; font-size: 14px; opacity: .85; }
  main { max-width: 560px; margin: -18px auto 40px; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px; }
  .notice { font-size: 14px; color: var(--muted); }
  .notice.demo { border-color: var(--sea); color: var(--text); background: var(--sky); }
  .step { font-size: 12px; font-weight: 700; color: var(--sea); letter-spacing: .04em; }
  h2 { margin: 2px 0 12px; font-size: 17px; }

  /* 달력 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head b { font-size: 16px; }
  .nav { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 18px; cursor: pointer; }
  .nav:disabled { opacity: .3; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .wd { font-size: 12px; color: var(--muted); padding: 4px 0; }
  .wd.sun { color: var(--warn); } .wd.sat { color: var(--sea); }
  .d { aspect-ratio: 1; border: 0; border-radius: 10px; background: transparent; color: var(--text);
    font: inherit; font-size: 15px; cursor: pointer; position: relative; padding: 0; }
  .d.open { background: var(--sky); font-weight: 500; }
  .d.open::after { content: ""; position: absolute; bottom: 6px; left: 50%; width: 5px; height: 5px;
    margin-left: -2.5px; border-radius: 50%; background: var(--sea); }
  .d.sel { background: var(--btn); color: #fff; }
  .d.sel::after { background: #fff; }
  .d:disabled { color: var(--muted); opacity: .35; cursor: default; }
  .d.hol:disabled, .d.sunday:disabled { color: var(--warn); }
  .legend { font-size: 12px; color: var(--muted); margin-top: 10px; display: flex; gap: 6px; align-items: center; }
  .legend i { width: 12px; height: 12px; border-radius: 4px; background: var(--sky); display: inline-block; }

  /* 수업 선택 */
  .cls { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit;
    color: inherit; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .cls:hover:not(:disabled) { border-color: var(--sea); }
  .cls.on { border-color: var(--sea); background: var(--sky); }
  .cls:disabled { cursor: not-allowed; opacity: .5; }
  .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); flex: none;
    display: grid; place-items: center; font-size: 14px; color: #fff; }
  .cls.on .box { background: var(--sea); border-color: var(--sea); }
  .cls .t { font-size: 17px; font-weight: 700; min-width: 54px; }
  .cls .n { flex: 1; font-size: 14px; }
  .cls .n small { display: block; font-size: 12px; color: var(--muted); }
  .seats { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--ok-bg); color: var(--ok); white-space: nowrap; }
  .seats.full { background: var(--warn-bg); color: var(--warn); }
  .rule { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* 정보 입력 */
  label { display: block; font-size: 13px; font-weight: 500; margin: 12px 0 6px; }
  input { width: 100%; font: inherit; font-size: 16px; padding: 12px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  input:focus { outline: 2px solid var(--sea); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--bg); color: var(--text); }
  .chip.on { background: var(--btn); border-color: var(--btn); color: #fff; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .summary { background: var(--sky); border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-top: 16px; }
  .summary b { color: var(--sea); }
  .submit { width: 100%; margin-top: 14px; padding: 15px; font: inherit; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--btn); border: 0; border-radius: 12px; cursor: pointer; }
  .submit:disabled { opacity: .45; cursor: not-allowed; }
  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 14px; display: none; }
  .msg.err { display: block; background: var(--warn-bg); color: var(--warn); }

  .done { text-align: center; padding: 28px 16px; }
  .done .big { font-size: 40px; }
  .done h2 { margin: 6px 0 10px; }
  .done p { color: var(--muted); font-size: 14px; margin: 4px 0; }
  .done button { margin-top: 16px; font: inherit; padding: 10px 18px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 32px; }
</style>
</head>
<body>
<header>
  <div class="brand">BLUE DOG FREEDIVING</div>
  <h1>수업 예약</h1>
  <p>날짜와 수업을 고르고 예약해 주세요</p>
</header>

<main>
  <div id="notice" class="card notice">시간표를 불러오는 중이에요…</div>

  <div id="booking" hidden>
    <section class="card">
      <div class="step">STEP 1</div>
      <h2>날짜 선택</h2>
      <div class="cal-head">
        <button class="nav" id="prev" type="button" aria-label="이전 달">‹</button>
        <b id="month"></b>
        <button class="nav" id="next" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend"><i></i> 예약 가능한 날 · 매주 월요일과 공휴일은 북항잠수풀 휴무예요</div>
    </section>

    <section class="card" id="step2" hidden>
      <div class="step">STEP 2</div>
      <h2 id="dayTitle">수업 선택</h2>
      <div id="classes"></div>
      <div class="rule">※ 10시 이론 ↔ 북항 1부, 북항 3부 ↔ 7시 이론은 시간이 겹쳐 함께 고를 수 없어요.</div>
    </section>

    <form class="card" id="step3" hidden>
      <div class="step">STEP 3</div>
      <h2>예약자 정보</h2>
      <label for="name">이름</label>
      <input id="name" autocomplete="name" required maxlength="20" placeholder="홍길동">
      <label for="phone">연락처</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" required placeholder="010-1234-5678">
      <label>렌탈 장비</label>
      <div class="chips" id="rental"></div>
      <div class="hint">여러 개 선택할 수 있어요. 개인 장비가 있으면 '없음'을 골라 주세요.</div>
      <div class="summary" id="summary"></div>
      <button class="submit" id="submit" type="submit">예약하기</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div id="done" class="card done" hidden></div>
</main>
<footer>예약 변경·취소는 카카오톡으로 강사님께 연락해 주세요.</footer>

<script>
const DEMO = !API_URL;
const WEEK = ['일','월','화','수','목','금','토'];
const RENTAL_OPTIONS = ['모두','슈트','핀','웨이트','스노클','없음'];
const ITEMS = ['슈트','핀','웨이트','스노클'];

let data = null;           // { classes, days }
let dayMap = {};           // date -> day
let view = null;           // { y, m } 보고 있는 달
let selDate = null;
let selClasses = [];
let rental = [];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);

/* ---------- 미리보기용 예시 데이터 (서버와 같은 규칙) ---------- */
function demoData() {
  const classes = [
    { name: '북항 1부', start: '09:30', end: '11:30', capacity: 4, conflicts: ['10시 이론'], place: '북항잠수풀' },
    { name: '10시 이론', start: '10:00', end: '12:00', capacity: 4, conflicts: ['북항 1부'], place: '블루독 교육장' },
    { name: '북항 2부', start: '14:00', end: '16:00', capacity: 4, conflicts: [], place: '북항잠수풀' },
    { name: '북항 3부', start: '18:10', end: '20:10', capacity: 4, conflicts: ['7시 이론'], place: '북항잠수풀' },
    { name: '7시 이론', start: '19:00', end: '21:00', capacity: 4, conflicts: ['북항 3부'], place: '블루독 교육장' },
  ];
  const t = new Date();
  const HOL = { '2026-10-03': '개천절', '2026-10-05': '대체공휴일', '2026-10-09': '한글날', '2026-12-25': '크리스마스' };
  const days = [];
  for (let i = 0; i <= 60; i++) {
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i);
    const date = ymd(d.getFullYear(), d.getMonth() + 1, d.getDate());
    const counts = {
      '북항 1부': i % 5 === 2 ? 4 : i % 3,
      '10시 이론': 0,
      '북항 2부': i % 4 === 1 ? 2 : 0,
      '북항 3부': i % 6 === 3 ? 1 : 0,
      '7시 이론': 0,
    };
    const slots = {}; let open = false;
    classes.forEach(c => {
      const booked = counts[c.name];
      let reason = '';
      if (d.getDay() === 1) reason = '월요일 휴무';
      else if (HOL[date]) reason = '공휴일 휴무';
      else if (i === 0) reason = '예약 마감';
      else if (booked >= c.capacity) reason = '정원 마감';
      else if (c.conflicts.some(o => counts[o] > 0)) reason = '겹치는 수업 진행';
      slots[c.name] = { booked, closed: !!reason, reason };
      if (!reason) open = true;
    });
    days.push({ date, weekday: WEEK[d.getDay()], open, slots, holiday: HOL[date] || '' });
  }
  return { classes, days };
}

/* ---------- 불러오기 ---------- */
async function load(keepSelection) {
  try {
    if (DEMO) {
      data = demoData();
      $('notice').className = 'card notice demo';
      $('notice').innerHTML = '👀 <b>미리보기 모드</b>예요. 예시 시간표로 화면만 보여드려요. (예약은 저장되지 않아요)';
    } else {
      const res = await fetch(API_URL);
      const j = await res.json();
      if (!j.ok) throw new Error(j.message);
      data = j;
      $('notice').className = 'card notice';
      $('notice').textContent = '🤿 정원이 차면 자동으로 마감돼요. 예약 후 완료 화면을 캡처해 두시면 편해요.';
    }
    dayMap = {};
    data.days.forEach(d => { dayMap[d.date] = d; });
    if (!view) {
      const first = data.days.find(d => d.open) || data.days[0];
      const [y, m] = first.date.split('-').map(Number);
      view = { y, m };
    }
    if (!keepSelection) { selDate = null; selClasses = []; }
    else if (selDate) {
      selClasses = selClasses.filter(c => dayMap[selDate] && !dayMap[selDate].slots[c].closed);
    }
    $('booking').hidden = false;
    renderCalendar(); renderClasses(); renderSummary();
  } catch (e) {
    $('notice').className = 'card notice';
    $('notice').textContent = '시간표를 불러오지 못했어요. 잠시 후 새로고침해 주세요.';
  }
}

/* ---------- STEP 1 달력 ---------- */
function renderCalendar() {
  const { y, m } = view;
  $('month').textContent = y + '년 ' + m + '월';
  const grid = $('grid'); grid.innerHTML = '';
  WEEK.forEach((w, i) => {
    const el = document.createElement('div');
    el.className = 'wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
    el.textContent = w; grid.appendChild(el);
  });
  const firstW = new Date(y, m - 1, 1).getDay();
  const last = new Date(y, m, 0).getDate();
  for (let i = 0; i < firstW; i++) grid.appendChild(document.createElement('div'));
  for (let d = 1; d <= last; d++) {
    const date = ymd(y, m, d);
    const day = dayMap[date];
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = d;
    b.className = 'd' + (day && day.open ? ' open' : '') + (date === selDate ? ' sel' : '')
      + (day && day.holiday ? ' hol' : '') + (new Date(y, m - 1, d).getDay() === 0 ? ' sunday' : '');
    if (day && day.holiday) { b.title = day.holiday; b.setAttribute('aria-label', d + '일 ' + day.holiday + ' 휴무'); }
    b.disabled = !(day && day.open);
    b.addEventListener('click', () => pickDate(date));
    grid.appendChild(b);
  }
  const firstDay = data.days[0].date, lastDay = data.days[data.days.length - 1].date;
  $('prev').disabled = ymd(y, m, 1) <= firstDay;
  $('next').disabled = ymd(y, m, last) >= lastDay;
}
$('prev').onclick = () => { view.m--; if (view.m < 1) { view.m = 12; view.y--; } renderCalendar(); };
$('next').onclick = () => { view.m++; if (view.m > 12) { view.m = 1; view.y++; } renderCalendar(); };

function niceDate(date) {
  const [y, m, d] = date.split('-').map(Number);
  return m + '월 ' + d + '일 (' + dayMap[date].weekday + ')';
}

function pickDate(date) {
  selDate = date; selClasses = [];
  renderCalendar(); renderClasses(); renderSummary();
  $('step2').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- STEP 2 수업 ---------- */
function renderClasses() {
  $('step2').hidden = !selDate;
  $('step3').hidden = !selDate || !selClasses.length;
  if (!selDate) return;
  $('dayTitle').textContent = niceDate(selDate) + ' 수업 선택';
  const box = $('classes'); box.innerHTML = '';
  const day = dayMap[selDate];
  data.classes.forEach(c => {
    const s = day.slots[c.name];
    const on = selClasses.includes(c.name);
    const blockedBy = c.conflicts.find(o => selClasses.includes(o));
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cls' + (on ? ' on' : '');
    b.disabled = s.closed || (!!blockedBy && !on);

    const box1 = document.createElement('span'); box1.className = 'box'; box1.textContent = on ? '✓' : '';
    const t = document.createElement('span'); t.className = 't'; t.textContent = c.start;
    const n = document.createElement('span'); n.className = 'n'; n.textContent = c.name;
    const sm = document.createElement('small');
    sm.textContent = (c.place || '') + (c.end ? ' · ~' + c.end : '');
    n.appendChild(sm);
    const seat = document.createElement('span');
    const left = c.capacity - s.booked;
    if (s.closed) { seat.className = 'seats full'; seat.textContent = s.reason === '겹치는 수업 진행' ? '진행 불가' : (s.reason || '마감'); }
    else if (blockedBy && !on) { seat.className = 'seats full'; seat.textContent = blockedBy + '와 겹침'; }
    else { seat.className = 'seats'; seat.textContent = left + '자리 남음'; }

    b.append(box1, t, n, seat);
    b.addEventListener('click', () => toggleClass(c.name));
    box.appendChild(b);
  });
}

function toggleClass(name) {
  selClasses = selClasses.includes(name) ? selClasses.filter(x => x !== name) : [...selClasses, name];
  const wasHidden = $('step3').hidden;
  renderClasses(); renderSummary();
  if (wasHidden && !$('step3').hidden) setTimeout(() => $('step3').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}

/* ---------- STEP 3 정보 ---------- */
function renderRental() {
  const box = $('rental'); box.innerHTML = '';
  RENTAL_OPTIONS.forEach(o => {
    const allOn = ITEMS.every(i => rental.includes(i));
    const on = o === '모두' ? allOn : rental.includes(o);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (on ? ' on' : ''); b.textContent = o;
    b.addEventListener('click', () => toggleRental(o));
    box.appendChild(b);
  });
}
function toggleRental(o) {
  if (o === '없음') rental = rental.includes('없음') ? [] : ['없음'];
  else if (o === '모두') rental = ITEMS.every(i => rental.includes(i)) ? [] : [...ITEMS];
  else {
    rental = rental.filter(x => x !== '없음');
    rental = rental.includes(o) ? rental.filter(x => x !== o) : [...rental, o];
  }
  renderRental(); renderSummary();
}
function rentalText() {
  if (rental.includes('없음')) return '없음';
  const list = ITEMS.filter(i => rental.includes(i));
  if (list.length === ITEMS.length) return '모두 (' + list.join(', ') + ')';
  return list.join(', ');
}

/* 연락처 자동 하이픈 */
$('phone').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g, '').slice(0, 11);
  e.target.value = d.length < 4 ? d : d.length < 8 ? d.slice(0,3) + '-' + d.slice(3)
    : d.length === 10 ? d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6)
    : d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
});

function renderSummary() {
  if (!selDate || !selClasses.length) return;
  const ordered = data.classes.filter(c => selClasses.includes(c.name));
  const s = $('summary'); s.innerHTML = '';
  const line1 = document.createElement('div');
  line1.append('📅 ');
  const b = document.createElement('b'); b.textContent = niceDate(selDate); line1.appendChild(b);
  const line2 = document.createElement('div');
  line2.textContent = '🤿 ' + ordered.map(c => c.name + ' ' + c.start).join(' · ');
  const line3 = document.createElement('div');
  line3.textContent = '🎒 렌탈: ' + (rental.length ? rentalText() : '선택 전');
  s.append(line1, line2, line3);
}

$('step3').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('name').value.trim();
  const phone = $('phone').value.replace(/\D/g, '');
  if (!name) return showErr('이름을 입력해 주세요.');
  if (!/^01\d{8,9}$/.test(phone)) return showErr('연락처를 010-1234-5678 형식으로 입력해 주세요.');
  if (!rental.length) return showErr('렌탈 장비를 선택해 주세요. (필요 없으면 \'없음\')');
  $('msg').className = 'msg';

  const body = { date: selDate, classes: selClasses, name, phone, rental };
  $('submit').disabled = true; $('submit').textContent = '예약 중…';
  try {
    let r;
    if (DEMO) { await new Promise(res => setTimeout(res, 600)); r = { ok: true }; }
    else {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
      r = await res.json();
    }
    if (!r.ok) { showErr(r.message || '예약하지 못했어요.'); await load(true); return; }
    showDone(body);
  } catch (err) {
    showErr('인터넷 연결을 확인하고 다시 시도해 주세요.');
  } finally {
    $('submit').disabled = false; $('submit').textContent = '예약하기';
  }
});

function showErr(t) { $('msg').className = 'msg err'; $('msg').textContent = t; }

function showDone(b) {
  $('booking').hidden = true; $('notice').hidden = true;
  const d = $('done'); d.hidden = false; d.innerHTML = '';
  const add = (tag, text, cls) => { const el = document.createElement(tag); el.textContent = text; if (cls) el.className = cls; d.appendChild(el); };
  const ordered = data.classes.filter(c => b.classes.includes(c.name));
  add('div', '🎉', 'big');
  add('h2', '예약이 완료됐어요');
  add('p', b.name + '님 · ' + $('phone').value);
  add('p', '📅 ' + niceDate(b.date));
  ordered.forEach(c => add('p', '🤿 ' + c.name + ' ' + c.start + (c.end ? '~' + c.end : '') + ' · ' + (c.place || '')));
  add('p', '🎒 렌탈: ' + rentalText());
  add('p', '이 화면을 캡처해 두세요. 변경은 카톡으로 연락 주세요.');
  const again = document.createElement('button');
  again.textContent = '다른 날짜도 예약하기';
  again.onclick = () => { d.hidden = true; $('notice').hidden = false; load(false); window.scrollTo({ top: 0 }); };
  d.appendChild(again);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderRental();
load(false);
</script>
</body>
</html>
