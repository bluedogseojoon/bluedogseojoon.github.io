<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>월간 예약 현황 | 블루독 프리다이빙</title>
<meta name="description" content="블루독 프리다이빙 월간 예약 현황. 비어 있는 시간을 확인하고 바로 예약하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="assets/schedule-api.js"></script>
<style>
  :root {
    --navy: #0B2545; --navy-2: #13315C; --sea: #1B6CA8; --sky: #E8F1FA;
    --bg: #F6F9FC; --card: #FFFFFF; --text: #14213D; --muted: #5B6B82; --line: #DCE4EE;
    --ok: #1E8E5A; --ok-bg: #E7F6EE; --warn: #B4412F; --warn-bg: #FBECE8; --amber: #9A6700; --amber-bg: #FFF4D6;
    --btn: #0B2545; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1628; --card: #10213A; --text: #E8EEF6; --muted: #9BAAC0; --line: #22385A;
      --sky: #15304F; --sea: #5AA7E6; --ok: #5FD39B; --ok-bg: #123A2A; --warn: #F08B77; --warn-bg: #3D1F1A;
      --amber: #F2C45A; --amber-bg: #3A2E10; --btn: #1B6CA8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1628; --card: #10213A; --text: #E8EEF6; --muted: #9BAAC0; --line: #22385A;
    --sky: #15304F; --sea: #5AA7E6; --ok: #5FD39B; --ok-bg: #123A2A; --warn: #F08B77; --warn-bg: #3D1F1A;
    --amber: #F2C45A; --amber-bg: #3A2E10; --btn: #1B6CA8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif; line-height: 1.5; }
  header { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; padding: 22px 16px 34px; text-align: center; }
  header .brand { font-size: 12px; letter-spacing: .12em; opacity: .8; }
  header h1 { margin: 4px 0 4px; font-size: 22px; }
  header p { margin: 0; font-size: 14px; opacity: .85; }
  main { max-width: 680px; margin: -18px auto 40px; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  .notice { font-size: 14px; color: var(--muted); }
  .notice.demo { background: var(--amber-bg); color: var(--amber); border-color: transparent; }

  /* 달력 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head b { font-size: 17px; }
  .nav { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 18px; cursor: pointer; }
  .nav:disabled { opacity: .3; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .wd { font-size: 12px; color: var(--muted); text-align: center; padding: 2px 0 4px; }
  .wd.sun { color: var(--warn); } .wd.sat { color: var(--sea); }
  .d { border: 1.5px solid transparent; border-radius: 10px; background: var(--bg); color: var(--text);
    font: inherit; padding: 4px 3px 5px; cursor: pointer; text-align: left; min-width: 0; }
  .d .num { display: block; font-size: 12px; font-weight: 700; padding-left: 2px; margin-bottom: 3px; }
  .d.sun .num { color: var(--warn); }
  .d.today .num { color: var(--sea); text-decoration: underline; text-underline-offset: 3px; }
  .d.today { border-color: var(--line); }
  .d.sel { border-color: var(--sea); background: var(--sky); }
  .d:disabled { cursor: default; }
  .d.past { opacity: .45; }
  .minis { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .m { font-size: 10px; line-height: 15px; height: 15px; text-align: center; border-radius: 4px; font-weight: 700; font-style: normal; overflow: hidden; }
  .m.free { background: var(--ok-bg); color: var(--ok); }
  .m.some { background: var(--amber-bg); color: var(--amber); }
  .m.full { background: var(--warn-bg); color: var(--warn); }
  .m.none, .m.past { background: transparent; color: var(--line); border: 1px dashed var(--line); line-height: 13px; }
  .m.past.was { background: var(--line); color: var(--muted); border: 0; line-height: 15px; }
  @media (min-width: 560px) {
    .grid { gap: 6px; }
    .d { padding: 6px 5px 7px; }
    .d .num { font-size: 13px; }
    .m { font-size: 11px; height: 18px; line-height: 18px; }
    .m.none, .m.past { line-height: 16px; }
  }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .m { display: inline-block; width: 20px; }
  .legend-note { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* 하루 상세 */
  .slot { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .slot .t { font-weight: 700; font-size: 15px; min-width: 92px; }
  .slot .memo { flex: 1; font-size: 13px; color: var(--muted); min-width: 0; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .chip.free { background: var(--ok-bg); color: var(--ok); }
  .chip.some { background: var(--amber-bg); color: var(--amber); }
  .chip.full { background: var(--warn-bg); color: var(--warn); }
  .chip.none, .chip.past { background: var(--bg); color: var(--muted); }
  .go { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 10px; border: 0;
    background: var(--btn); color: #fff; cursor: pointer; white-space: nowrap; }
  .slot.on { border-color: var(--sea); background: var(--sky); }
  @media (max-width: 420px) {
    .slot { flex-wrap: wrap; }
    .slot .memo { order: 3; flex-basis: 100%; }
    .slot .t { min-width: 0; flex: 1; }
  }

  /* 예약 폼 */
  label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; font-size: 16px; padding: 12px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .summary { background: var(--sky); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .summary b { color: var(--sea); }
  .submit { width: 100%; margin-top: 16px; padding: 15px; font: inherit; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--btn); border: 0; border-radius: 12px; cursor: pointer; }
  .submit:disabled { opacity: .45; cursor: not-allowed; }
  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 14px; background: var(--warn-bg); color: var(--warn); }
  .privacy { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .done { text-align: center; padding: 28px 16px; }
  .done .big { font-size: 40px; }
  .done h2 { margin: 6px 0 10px; }
  .done p { color: var(--muted); font-size: 14px; margin: 4px 0; }
  .done button { margin-top: 16px; font: inherit; padding: 10px 18px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 32px; }
  footer a { color: var(--sea); }
</style>
</head>
<body>
<header>
  <div class="brand">BLUE DOG FREEDIVING</div>
  <h1>월간 예약 현황</h1>
  <p>비어 있는 시간을 확인하고 바로 예약하세요</p>
</header>

<main>
  <div id="notice" class="card notice">스케줄을 불러오는 중이에요…</div>

  <div id="app" hidden>
    <section class="card">
      <div class="cal-head">
        <button class="nav" id="prev" type="button" aria-label="이전 달">‹</button>
        <b id="month"></b>
        <button class="nav" id="next" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i class="m free">9</i>예약 가능</span>
        <span><i class="m some">9</i>예약 있음 (자리 남음)</span>
        <span><i class="m full">9</i>예약 마감</span>
        <span><i class="m none">9</i>운영 안 함</span>
      </div>
      <div class="legend-note">칸 안의 숫자는 시작 시간이에요: 9시 · 12시 · 3시 · 6시 (각 3시간)</div>
    </section>

    <section class="card" id="day" hidden></section>

    <form class="card" id="form" hidden>
      <h2>예약자 정보</h2>
      <div class="summary" id="summary"></div>
      <label for="name">이름</label>
      <input id="name" autocomplete="name" required maxlength="20" placeholder="홍길동">
      <label for="req">요청사항 (선택)</label>
      <input id="req" maxlength="100" placeholder="예) 개인 트레이닝, 장비 렌탈 필요">
      <button class="submit" id="submit" type="submit">예약하기</button>
      <div class="msg" id="msg" hidden></div>
      <div class="privacy">이름은 강사님만 볼 수 있어요. 다른 회원에게는 '예약 있음'으로만 보여요.</div>
    </form>
  </div>

  <div id="done" class="card done" hidden></div>
</main>
<footer>예약 변경·취소는 <a href="http://pf.kakao.com/_exhUms/chat" target="_blank" rel="noopener">카카오톡</a>으로 강사님께 연락해 주세요.</footer>

<script>
const WEEK = ['일','월','화','수','목','금','토'];
const SHORT = { s1: '9', s2: '12', s3: '3', s4: '6' };
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

let data = null;       // 지금 보고 있는 달
let month = null;      // 'YYYY-MM'
let selDate = null, selSlot = null;
let range = null;      // { first, last } 볼 수 있는 달

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function slotState(date, s) {
  const c = (data.days[date] || {})[s.key] || { open: false, cap: 0, booked: 0, memo: '' };
  const past = date < data.today || (date === data.today && s.start <= data.time);
  if (past) return { st: 'past', c, text: '지난 시간', was: c.open || c.booked > 0 };
  if (c.booked >= Math.max(c.cap, 1) && (c.booked > 0)) return { st: 'full', c, text: '예약 마감' };
  if (!c.open) return { st: 'none', c, text: '운영 안 함' };
  if (c.booked > 0) return { st: 'some', c, text: '예약 있음 · ' + (c.cap - c.booked) + '자리 남음' };
  return { st: 'free', c, text: c.cap > 1 ? '예약 가능 · ' + c.cap + '자리' : '예약 가능' };
}

async function load(m, keep) {
  try {
    const r = await SCHED.get(m || '');
    if (!r.ok) throw new Error(r.message);
    data = r; month = r.month;
    range = { first: r.thisMonth, last: r.lastMonth };
    if (SCHED.DEMO) {
      $('notice').className = 'card notice demo';
      $('notice').innerHTML = '👀 <b>미리보기 모드</b>예요. 예시 스케줄이라 예약은 실제로 접수되지 않아요.';
    } else {
      $('notice').className = 'card notice';
      $('notice').textContent = '🤿 초록색 시간은 바로 예약할 수 있어요. 날짜를 눌러 시간을 골라 주세요.';
    }
    $('app').hidden = false;
    if (!keep || !selDate || selDate.slice(0, 7) !== month) {
      selSlot = null;
      selDate = pickDefaultDay();
    }
    render();
  } catch (e) {
    $('notice').className = 'card notice';
    $('notice').textContent = '스케줄을 불러오지 못했어요. 잠시 후 새로고침해 주세요.';
  }
}

function daysInMonth() { const [y, m] = month.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function pickDefaultDay() {
  const last = daysInMonth();
  for (let d = 1; d <= last; d++) {
    const date = month + '-' + pad(d);
    if (date < data.today) continue;
    if (data.slots.some(s => ['free', 'some'].includes(slotState(date, s).st))) return date;
  }
  return month === data.thisMonth ? data.today : month + '-01';
}

function render() { renderCalendar(); renderDay(); renderForm(); }

function renderCalendar() {
  const [y, m] = month.split('-').map(Number);
  $('month').textContent = y + '년 ' + m + '월';
  const grid = $('grid'); grid.innerHTML = '';
  WEEK.forEach((w, i) => grid.appendChild(el('div', 'wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : ''), w)));
  const firstW = new Date(y, m - 1, 1).getDay();
  for (let i = 0; i < firstW; i++) grid.appendChild(el('div'));
  const last = daysInMonth();
  for (let d = 1; d <= last; d++) {
    const date = month + '-' + pad(d);
    const b = el('button', 'd');
    b.type = 'button';
    if (new Date(y, m - 1, d).getDay() === 0) b.classList.add('sun');
    if (date === data.today) b.classList.add('today');
    if (date < data.today) b.classList.add('past');
    if (date === selDate) b.classList.add('sel');
    b.appendChild(el('span', 'num', d));
    const minis = el('div', 'minis');
    const said = [];
    data.slots.forEach(s => {
      const st = slotState(date, s);
      minis.appendChild(el('i', 'm ' + st.st + (st.was ? ' was' : ''), SHORT[s.key]));
      said.push(s.label + ' ' + st.text);
    });
    b.appendChild(minis);
    b.setAttribute('aria-label', m + '월 ' + d + '일: ' + said.join(', '));
    b.onclick = () => { selDate = date; selSlot = null; render(); $('day').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    grid.appendChild(b);
  }
  $('prev').disabled = month <= range.first;
  $('next').disabled = month >= range.last;
}
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
function go(n) { selDate = null; selSlot = null; $('grid').style.opacity = .5; load(SCHED.addMonths(month, n)).then(() => { $('grid').style.opacity = ''; }); }

function niceDate(date) {
  const [y, m, d] = date.split('-').map(Number);
  return m + '월 ' + d + '일 (' + WEEK[new Date(y, m - 1, d).getDay()] + ')';
}

function renderDay() {
  const box = $('day');
  box.hidden = !selDate; if (!selDate) return;
  box.innerHTML = '';
  box.appendChild(el('h2', null, niceDate(selDate)));
  let any = false;
  data.slots.forEach(s => {
    const st = slotState(selDate, s);
    const row = el('div', 'slot' + (selSlot === s.key ? ' on' : ''));
    row.appendChild(el('span', 't', s.label));
    row.appendChild(el('span', 'memo', st.c.memo || ''));
    row.appendChild(el('span', 'chip ' + st.st, st.text));
    if (st.st === 'free' || st.st === 'some') {
      any = true;
      const b = el('button', 'go', selSlot === s.key ? '선택됨' : '예약하기');
      b.type = 'button';
      b.onclick = () => {
        selSlot = s.key; renderDay(); renderForm();
        setTimeout(() => $('form').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
      };
      row.appendChild(b);
    }
    box.appendChild(row);
  });
  if (!any) box.appendChild(el('div', 'legend-note', '이 날은 예약할 수 있는 시간이 없어요. 다른 날짜를 골라 주세요.'));
}

function renderForm() {
  $('form').hidden = !selSlot;
  if (!selSlot) return;
  const s = data.slots.find(x => x.key === selSlot);
  const sum = $('summary'); sum.innerHTML = '';
  sum.append('📅 ');
  sum.appendChild(el('b', null, niceDate(selDate)));
  sum.append('  ·  🕘 ' + s.label);
}

function showErr(t) { $('msg').hidden = false; $('msg').textContent = t; }

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('name').value.trim();
  if (!name) return showErr('이름을 입력해 주세요.');
  $('msg').hidden = true;
  const body = { action: 'book', date: selDate, slot: selSlot, name, req: $('req').value.trim() };
  $('submit').disabled = true; $('submit').textContent = '예약 중…';
  try {
    const r = await SCHED.post(body);
    if (!r.ok) { showErr(r.message || '예약하지 못했어요.'); await load(month, true); return; }
    showDone(body);
  } catch (err) {
    showErr('인터넷 연결을 확인하고 다시 시도해 주세요.');
  } finally {
    $('submit').disabled = false; $('submit').textContent = '예약하기';
  }
});

function showDone(b) {
  $('app').hidden = true; $('notice').hidden = true;
  const d = $('done'); d.hidden = false; d.innerHTML = '';
  const s = data.slots.find(x => x.key === b.slot);
  d.appendChild(el('div', 'big', '🎉'));
  d.appendChild(el('h2', null, '예약이 완료됐어요'));
  d.appendChild(el('p', null, b.name + '님'));
  d.appendChild(el('p', null, '📅 ' + niceDate(b.date) + ' · ' + s.label));
  if (b.req) d.appendChild(el('p', null, '📝 ' + b.req));
  d.appendChild(el('p', null, '이 화면을 캡처해 두세요. 변경·취소는 카톡으로 연락 주세요.'));
  const again = el('button', null, '다른 시간도 예약하기');
  again.onclick = () => { d.hidden = true; $('notice').hidden = false; selSlot = null; load(month, true); window.scrollTo({ top: 0 }); };
  d.appendChild(again);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

load('');
</script>
</body>
</html>
